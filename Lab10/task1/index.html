
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал оценок студентов</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

    <div class="container">
        <h1>📚 Журнал оценок студентов</h1>
        <p class="subtitle">Управление успеваемостью студентов</p>

        <form id="gradeForm">
            <input
                type="text"
                id="studentName"
                placeholder="Имя студента"
            >

            <input
                type="number"
                id="studentGrade"
                placeholder="Оценка (1–100)"
            >

            <button type="submit">Добавить студента</button>
        </form>

        <p id="message" aria-live="polite"></p>

        <div class="statistics">
            <div class="stat-card">
                <h3>Количество студентов</h3>
                <p id="studentCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Средний балл</h3>
                <p id="averageGrade">0</p>
            </div>
        </div>

        <h2>Список студентов</h2>

        <div id="studentList"></div>

        <button id="clearButton" class="clear-button">
            Очистить журнал
        </button>
    </div>

    <script type="module" src="./src/main.js"></script>

</body>
</html>
