
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебная аналитика</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

<div class="container">

    <h1>📊 Учебная аналитика</h1>
    <p class="subtitle">Система анализа успеваемости студентов</p>

    <h2>Добавить студента</h2>

    <form id="studentForm">
        <input type="text" id="studentName"
               placeholder="Имя студента">

        <input type="text" id="studentGroup"
               placeholder="Группа">

        <input type="number" id="grade1"
               placeholder="Оценка 1">

        <input type="number" id="grade2"
               placeholder="Оценка 2">

        <input type="number" id="grade3"
               placeholder="Оценка 3">

        <button type="submit">Добавить</button>
    </form>

    <p id="message" aria-live="polite"></p>

    <h2>Статистика</h2>

    <div class="statistics">
        <div class="stat-card">
            <h3>Студентов</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="stat-card">
            <h3>Средний балл</h3>
            <p id="overallAverage">0</p>
        </div>
    </div>

    <h2>Поиск и фильтрация</h2>

    <div class="filters">
        <input type="text" id="searchInput"
               placeholder="Поиск по имени">

        <input type="text" id="groupFilter"
               placeholder="Фильтр по группе">

        <select id="sortSelect">
            <option value="none">Без сортировки</option>
            <option value="asc">По возрастанию балла</option>
            <option value="desc">По убыванию балла</option>
        </select>
    </div>

    <h2>Список студентов</h2>

    <div id="studentList"></div>

    <button id="clearButton" class="clear-button">
        Очистить список
    </button>

</div>

<script type="module" src="./src/main.js"></script>

</body>
</html>
