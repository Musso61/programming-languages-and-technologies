
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Генератор приветствий</title>

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>👋 Генератор приветствий</h1>
            <p>Создай красивое приветствие для любого человека!</p>
        </div>

        <div class="form-box">

            <label for="userName">Введите имя:</label>

            <input
                type="text"
                id="userName"
                placeholder="Например, Алина"
                maxlength="50"
            >

            <label for="greetingType">
                Выберите стиль приветствия:
            </label>

            <select id="greetingType">
                <option value="simple">Обычное</option>
                <option value="friendly">Дружеское</option>
                <option value="official">Официальное</option>
            </select>

            <button id="generateButton">
                ✨ Создать приветствие
            </button>

            <button id="clearButton" class="clear-button">
                Очистить
            </button>

        </div>

        <p id="message" aria-live="polite"></p>

        <div class="result-box">

            <h2>Ваше приветствие</h2>

            <p id="result">
                Здесь появится ваше приветствие...
            </p>

            <button id="copyButton">
                📋 Скопировать приветствие
            </button>

        </div>

        <p class="footer">
            Лабораторная работа №10 | Вариант №3
        </p>

    </div>

    <!-- Подключение JavaScript -->
    <script type="module" src="./src/main.js"></script>

</body>
</html>
