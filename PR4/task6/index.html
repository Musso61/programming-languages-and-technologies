<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма подписки</title>
    <link rel="stylesheet" href="C:\Users\Student\Project\programming-languages-and-technologies\PR4\task6\style.css">
</head>
<body>

<div class="container">
    <h1>Подписка на новости</h1>

    <form id="subscriptionForm">

        <label for="name">Имя:</label>
        <input type="text" id="name" placeholder="Введите имя">
        <p class="error" id="nameError"></p>

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="example@mail.com">
        <p class="error" id="emailError"></p>

        <fieldset>
            <legend>Интересующие темы:</legend>

            <label>
                <input type="checkbox" name="topics" value="Программирование">
                Программирование
            </label>

            <label>
                <input type="checkbox" name="topics" value="Веб-разработка">
                Веб-разработка
            </label>

            <label>
                <input type="checkbox" name="topics" value="Искусственный интеллект">
                Искусственный интеллект
            </label>

            <label>
                <input type="checkbox" name="topics" value="Новости технологий">
                Новости технологий
            </label>
        </fieldset>

        <p class="error" id="topicsError"></p>

        <button type="submit">Подписаться</button>
    </form>

    <div id="message"></div>
</div>

<script src="script.js"></script>
</body>
</html>
